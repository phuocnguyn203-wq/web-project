# web (Next.js) -> api (Node/Express: REST, auth, Postgres) -> ai (FastAPI, internal) -> Redis -> worker (RQ)
# The worker reports progress and results back to api; only api touches the database.
x-ai-env: &ai-env
  REDIS_URL: redis://redis:6379
  API_INTERNAL_URL: http://api:8000

services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lc, POSTGRES_PASSWORD: lc, POSTGRES_DB: lc }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: backend
    env_file: [{ path: .env, required: false }] # without .env everything runs on the mock engines
    environment:
      DATABASE_URL: postgres://lc:lc@db:5432/lc
      AI_URL: http://ai:8001
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_started }

  ai:
    build: { context: ., dockerfile: ai/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment: *ai-env
    volumes: [uploads:/data/uploads] # reads the files api saved
    restart: unless-stopped
    depends_on: [redis]

  worker:
    build: { context: ., dockerfile: ai/Dockerfile }
    command: ["rq", "worker", "--url", "redis://redis:6379"]
    env_file: [{ path: .env, required: false }]
    environment: *ai-env
    volumes: [uploads:/data/uploads]
    restart: unless-stopped
    depends_on: [redis]

  web:
    build:
      context: frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
