services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: lc, POSTGRES_PASSWORD: lc, POSTGRES_DB: lc }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lc:lc@db:5432/lc
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["rq", "worker", "--url", "redis://redis:6379"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lc:lc@db:5432/lc
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      api: { condition: service_started } # api runs the migrations

  web:
    build:
      context: frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
