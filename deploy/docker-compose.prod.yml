# Production overlay on a single VPS. From the repo root:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Only Caddy is reachable from outside (80/443, automatic HTTPS). Web and API share one domain: /api/* -> api.
# Relative paths resolve from the repo root (the first compose file's folder).

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-internal: &internal
  APP_ENV: production # api and ai refuse to start with placeholder secrets
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}

services:
  db:
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}" }
    restart: unless-stopped
    logging: *logging

  redis:
    restart: unless-stopped
    logging: *logging

  api:
    ports: !reset []
    environment:
      <<: *internal
      DATABASE_URL: postgres://lc:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/lc
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
    logging: *logging

  ai:
    environment: *internal
    logging: *logging

  worker:
    environment: *internal
    logging: *logging

  web:
    build:
      args: { NEXT_PUBLIC_API_URL: /api }
    ports: !reset []
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN:?set DOMAIN in .env}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
